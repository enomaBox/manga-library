<!DOCTYPE html>
<!-- manga-smooth-scroll 라이브러리 뷰어 — 인증 정보는 localStorage 보관, 데이터는 Supabase REST 직접 조회 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="만화 라이브러리">
<title>만화 라이브러리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f4f5;--card:#fff;--fg:#1a1a1a;--sub:#71717a;
  --line:#e4e4e7;--accent:#2563eb;--accent2:#1d4ed8;
  --danger:#dc2626;
  --st-reading:#16a34a;--st-paused:#ea580c;--st-done:#6b7280;
  --b-completed:#7c3aed;--b-ongoing:#0891b2;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181b;--card:#27272a;--fg:#f4f4f5;--sub:#a1a1aa;
  --line:#3f3f46;--accent:#60a5fa;--accent2:#93c5fd;
}}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif;
  padding:0 12px env(safe-area-inset-bottom);
  max-width:720px;margin:0 auto;min-height:100dvh;overflow-x:hidden;
}

/* ── 설정 화면 ── */
#setup{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100dvh;gap:20px;padding:24px 0}
.setup-box{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.setup-box h1{font-size:20px;font-weight:700}
.setup-box p{font-size:14px;color:var(--sub);line-height:1.5}
label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:11px 14px;font-size:14px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);outline:none}
input[type=text]:focus,input[type=password]:focus{border-color:var(--accent)}
.btn{padding:12px;font-size:15px;font-weight:600;font-family:inherit;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer}
.btn:active{background:var(--accent2)}
.btn-ghost{background:none;color:var(--sub);border:1px solid var(--line);padding:9px 14px;font-size:13px;font-weight:500;font-family:inherit;border-radius:10px;cursor:pointer}
.err-msg{font-size:13px;color:var(--danger);min-height:18px}

/* ── 메인 화면 ── */
#main{display:none}

/* 헤더 */
header{position:sticky;top:0;background:var(--bg);padding:12px 0 0;z-index:20;border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:6px}
h1{font-size:18px;font-weight:700;flex:1}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:20px;padding:6px;line-height:1}
.icon-btn:active{color:var(--accent)}
.stat{color:var(--sub);font-size:12px;margin:4px 0 8px}

/* 필터 탭 */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;font-size:13px;font-weight:600;font-family:inherit;border:1.5px solid var(--line);border-radius:20px;background:none;color:var(--sub);cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* 정렬/완결 툴바 */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sort-btns{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sort-btn{padding:5px 12px;font-size:12px;font-weight:600;font-family:inherit;background:none;color:var(--sub);border:none;cursor:pointer}
.sort-btn.active{background:var(--accent);color:#fff}
.sort-btn+.sort-btn{border-left:1px solid var(--line)}
.chip{padding:5px 12px;font-size:12px;font-weight:600;font-family:inherit;border:1.5px solid var(--line);border-radius:20px;background:none;color:var(--sub);cursor:pointer}
.chip.active{border-color:var(--b-completed);color:var(--b-completed)}

/* 검색 */
.search{width:100%;padding:9px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);outline:none;font-family:inherit;margin-bottom:10px}
.search:focus{border-color:var(--accent)}

/* Pull-to-refresh */
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:22px;transition:height .15s}
#ptr.active{height:48px}

/* 카드 리스트 */
.list{padding:4px 0 40px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--line)}
.thumb-wrap{width:96px;height:54px;flex-shrink:0;border-radius:8px;overflow:hidden;background:var(--line)}
.thumb{width:100%;height:100%;object-fit:cover;display:block}
.thumb-empty{width:96px;height:54px;flex-shrink:0;border-radius:8px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:26px}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.title-row{display:flex;align-items:center;gap:5px}
.pin{font-size:12px}
.title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--fg)}
a.title:active{color:var(--accent)}
.meta-row,.sub-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chapter{font-size:14px;font-weight:700;color:var(--accent)}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.st-reading{background:var(--st-reading)}
.st-paused{background:var(--st-paused)}
.st-done{background:var(--st-done)}
.b-completed{background:var(--b-completed)}
.b-ongoing{background:var(--b-ongoing)}
.sub-row{font-size:12px;color:var(--sub)}
.links{display:flex;gap:5px;flex-wrap:wrap}
.site-link{color:var(--sub);border:1px solid var(--line);padding:1px 7px;border-radius:5px;font-size:11px;text-decoration:none}
.site-link:active{color:var(--accent);border-color:var(--accent)}
.empty,.no-match,.loading{text-align:center;color:var(--sub);padding:60px 0;font-size:14px}

/* ── 통계 모달 ── */
#stats-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);align-items:flex-end}
#stats-modal.open{display:flex}
.stats-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:720px;margin:0 auto}
.stats-sheet h2{font-size:17px;font-weight:700;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--bg);border-radius:12px;padding:14px}
.stat-card .num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:12px;color:var(--sub);margin-top:2px}
.stat-card.full{grid-column:1/-1}
.modal-close{width:100%;margin-top:16px}

/* ── 갱신 실패 배너 ── */
/* fetch 실패 시 캐시를 조용히 계속 보여주면 옛 URL을 최신으로 오인하게 된다. 반드시 노출한다. */
#stale{display:none;align-items:center;gap:8px;margin:0 0 8px;padding:9px 12px;border-radius:10px;
  background:#7c2d12;color:#fed7aa;border:1px solid #9a3412;font-size:12px;line-height:1.45}
#stale.show{display:flex}
#stale .msg{flex:1;min-width:0}
#stale button{flex-shrink:0;background:none;border:1px solid #c2410c;color:#fed7aa;
  border-radius:7px;padding:4px 10px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer}

/* ── 토스트 ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  display:flex;gap:10px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:7px;padding:3px 9px;
  font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;pointer-events:auto;flex-shrink:0}

/* ── 바텀시트 공통 ── */
.sheet-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);align-items:flex-end}
.sheet-modal.open{display:flex}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:720px;margin:0 auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sub{font-size:12px;color:var(--sub);margin-bottom:16px;line-height:1.5}
.field{margin-bottom:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px 0;font-size:13px;font-weight:600;font-family:inherit;background:none;color:var(--sub);border:none;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.row-inline{display:flex;gap:8px;align-items:center}
.row-inline input[type=number]{flex:1;padding:11px 14px;font-size:15px;font-family:inherit;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);outline:none}
.btn-danger{width:100%;padding:11px;font-size:14px;font-weight:600;font-family:inherit;
  background:none;color:var(--danger);border:1px solid var(--danger);border-radius:10px;cursor:pointer}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions>*{flex:1}

/* ── 도메인 점검 ── */
.dom-group{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.dom-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dom-site{font-size:13px;font-weight:700;color:var(--accent)}
.dom-warn{font-size:10px;font-weight:600;color:var(--st-paused);border:1px solid var(--st-paused);border-radius:5px;padding:1px 5px}
.dom-all{margin-left:auto}
.dom-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.dom-name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom-cnt{font-size:11px;color:var(--sub);flex-shrink:0}
.dom-btn{flex-shrink:0;background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.dom-btn:disabled{opacity:.35;cursor:default}

/* 카드 편집 진입 */
.card-edit{background:none;border:none;color:var(--sub);font-size:19px;line-height:1;
  padding:0 2px;cursor:pointer;align-self:flex-start;flex-shrink:0}
.site-sel{padding:5px 8px;font-size:12px;font-family:inherit;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--fg)}
</style>
</head>
<body>

<!-- 설정 화면 -->
<div id="setup">
  <div class="setup-box">
    <h1>📚 만화 라이브러리 설정</h1>
    <p>Supabase 프로젝트 URL과 anon key를 입력하세요.<br>입력 정보는 이 기기의 브라우저에만 저장됩니다.</p>
    <div>
      <label for="inp-url">Supabase 프로젝트 URL</label>
      <input id="inp-url" type="text" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false">
    </div>
    <div>
      <label for="inp-key">Anon Key</label>
      <input id="inp-key" type="password" placeholder="eyJhbGciOi..." autocomplete="off">
    </div>
    <div class="err-msg" id="setup-err"></div>
    <button class="btn" id="setup-save">저장하고 시작</button>
  </div>
</div>

<!-- 메인 화면 -->
<div id="main">
  <header>
    <div class="hdr-top">
      <h1>📚 만화 라이브러리</h1>
      <button class="icon-btn" id="btn-stats" title="통계">📊</button>
      <button class="icon-btn" id="btn-domain" title="도메인 점검">🌐</button>
      <button class="icon-btn" id="btn-refresh" title="새로고침">↺</button>
      <button class="icon-btn" id="btn-settings" title="설정">⚙</button>
    </div>
    <div class="stat" id="stat"></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-status="all">전체</button>
      <button class="tab" data-status="reading">읽는 중</button>
      <button class="tab" data-status="paused">중단</button>
      <button class="tab" data-status="done">완료</button>
    </div>
    <div class="toolbar">
      <div class="sort-btns">
        <button class="sort-btn active" data-sort="recent">최근</button>
        <button class="sort-btn" data-sort="title">제목</button>
        <button class="sort-btn" data-sort="chapter">화수</button>
      </div>
      <button class="chip" id="chip-completed">완결만</button>
      <select class="site-sel" id="site-filter" title="사이트 필터"><option value="">모든 사이트</option></select>
    </div>
    <input class="search" type="search" id="search" placeholder="제목 검색" autocomplete="off">
  </header>

  <div id="ptr">↓</div>
  <div id="stale"><span class="msg"></span><button id="stale-retry">다시 시도</button></div>
  <div class="list" id="list"></div>
</div>

<!-- 통계 모달 -->
<div id="stats-modal">
  <div class="stats-sheet">
    <h2>📊 라이브러리 통계</h2>
    <div class="stat-grid" id="stat-grid"></div>
    <button class="btn modal-close" id="stats-close">닫기</button>
  </div>
</div>

<!-- 작품 편집 시트 -->
<div class="sheet-modal" id="work-modal">
  <div class="sheet">
    <h2 id="work-title"></h2>
    <div class="sub" id="work-sub"></div>

    <div class="field">
      <label>상태</label>
      <div class="seg" id="work-status">
        <button data-v="reading">읽는 중</button>
        <button data-v="paused">중단</button>
        <button data-v="done">완료</button>
      </div>
    </div>

    <div class="field">
      <label>고정</label>
      <div class="seg" id="work-pin">
        <button data-v="1">📌 고정</button>
        <button data-v="0">해제</button>
      </div>
    </div>

    <div class="field">
      <label for="work-ch">읽은 화수</label>
      <div class="row-inline">
        <input type="number" id="work-ch" min="0" step="1" inputmode="numeric">
        <button class="btn" id="work-ch-save" style="flex:0 0 auto;padding:11px 18px">저장</button>
      </div>
    </div>

    <button class="btn-danger" id="work-del">🗑 라이브러리에서 삭제</button>
    <div class="sheet-actions"><button class="btn-ghost" id="work-close">닫기</button></div>
  </div>
</div>

<!-- 도메인 점검 시트 -->
<div class="sheet-modal" id="domain-modal">
  <div class="sheet">
    <h2>🌐 도메인 점검</h2>
    <div class="sub">사이트별로 저장된 주소입니다. 옛 주소가 여러 종이면 [모두 변경]으로 한 번에 맞춥니다.<br>
      바꿀 주소를 입력한 뒤 아래 목록에서 버튼을 누르세요.</div>
    <div class="field">
      <label for="dom-new">새 도메인</label>
      <input type="text" id="dom-new" placeholder="wfwf490.com" autocomplete="off" spellcheck="false">
    </div>
    <div id="dom-list"></div>
    <div class="sheet-actions">
      <button class="btn-ghost" id="dom-undo">↩ 되돌리기</button>
      <button class="btn-ghost" id="dom-close">닫기</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORE_URL   = 'mss_supabase_url';
const STORE_KEY   = 'mss_supabase_key';
const STORE_CACHE = 'mss_cache';
const STORE_CACHE_AT = 'mss_cache_at';   // 캐시를 마지막으로 채운 시각 — 갱신 실패 배너에 표시
const STORE_UNDO  = 'mss_undo';          // 도메인 일괄 변경 직전 원본 (되돌리기용)
const META_KEY    = '__mss_meta';
const SYNC_KEY    = '__mss_sync';

// ── 유틸 ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(u) {
  if (!u) return '';
  try { const p = new URL(u).protocol; return (p==='https:'||p==='http:') ? u : ''; } catch { return ''; }
}
function safeThumbDataUri(u) {
  const v = String(u ?? '').trim();
  return /^data:image\/(?:webp|jpeg|png);base64,[A-Za-z0-9+/]+={0,2}$/i.test(v) ? v : '';
}
function relTime(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const d = Date.now()-t, m = Math.floor(d/60000);
  if (m < 1)  return '방금 전';
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}시간 전`;
  const day = Math.floor(h/24);
  if (day < 30) return `${day}일 전`;
  return new Date(t).toISOString().slice(0,10);
}
function visibleSites(sites) {
  if (!sites || typeof sites !== 'object') return [];
  return Object.entries(sites).filter(([k]) => k !== SYNC_KEY && !k.startsWith('__'));
}
function extractMeta(sites) {
  const m = sites?.[META_KEY];
  return m && typeof m === 'object' ? m : null;
}
function isCompletedRow(row) {
  const meta = extractMeta(row.sites);
  return row.series === 'completed' || !!meta?.isCompleted;
}
// wsrv.nl 프록시로 썸네일 URL 변환 — 망가 사이트 핫링크 차단 우회
function proxyThumb(url) {
  const safe = safeUrl(url); if (!safe) return '';
  return 'https://wsrv.nl/?url=' + encodeURIComponent(safe) + '&w=120&h=160&fit=cover&output=webp';
}

// ── 상태 ──────────────────────────────────────────────────────────────
let allRows = [];
let activeStatus = 'all';
let activeSort   = 'recent';
let activeSite   = '';
let onlyComplete = false;

// 유저스크립트와 같은 동기화 규약 (필드별 Last-Write-Wins).
// sites.__mss_sync 의 *UpdatedAt 을 올리지 않으면 유저스크립트가 다음 pull에서 옛 값으로 되돌린다.
const DATA_VERSION = 2;
const SYNC_FIELDS = {
  title:'titleUpdatedAt', chapter:'chapterUpdatedAt', sites:'sitesUpdatedAt',
  pinned:'pinnedUpdatedAt', status:'statusUpdatedAt', series:'seriesUpdatedAt', meta:'metaUpdatedAt',
};
const HOST_PAT = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/;
const clone = v => JSON.parse(JSON.stringify(v));

// ── 카드 렌더 ──────────────────────────────────────────────────────────
function renderCard(row) {
  const meta    = extractMeta(row.sites);
  const sv      = visibleSites(row.sites);
  const primary = sv.slice().sort((a,b) => Date.parse(b[1]?.updatedAt||'') - Date.parse(a[1]?.updatedAt||''))[0];
  const href    = safeUrl(primary?.[1]?.url || meta?.listUrl || '');

  const total   = meta?.totalChapters;
  const chTxt   = total ? `${row.chapter} / ${total}화` : `${row.chapter}화`;

  const stBadge = row.status === 'paused' ? '<span class="badge st-paused">중단</span>'
                : row.status === 'done'   ? '<span class="badge st-done">완료</span>'
                :                           '<span class="badge st-reading">읽는 중</span>';
  const seBadge = isCompletedRow(row)     ? '<span class="badge b-completed">완결</span>'
                : row.series === 'ongoing' ? '<span class="badge b-ongoing">연재중</span>'
                : '';

  // 썸네일: 저장된 data URI 우선, 없으면 wsrv.nl 프록시 폴백
  const thumbUrl = safeThumbDataUri(meta?.thumbData) || proxyThumb(meta?.thumbnail);
  const thumbHtml = thumbUrl
    ? `<div class="thumb-wrap"><img class="thumb" src="${esc(thumbUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.outerHTML='<div class=thumb-empty>📖</div>'"></div>`
    : `<div class="thumb-empty">📖</div>`;

  const links = sv.map(([id, info]) => {
    const u = safeUrl(info?.url);
    return u ? `<a class="site-link" href="${esc(u)}" target="_blank" rel="noopener">${esc(id)}</a>` : '';
  }).join('');

  const pin     = row.pinned ? '<span class="pin">📌</span>' : '';
  const titleEl = href
    ? `<a class="title" href="${esc(href)}" target="_blank" rel="noopener">${esc(row.title)}</a>`
    : `<span class="title">${esc(row.title)}</span>`;

  return `
<div class="card">
  ${thumbHtml}
  <div class="info">
    <div class="title-row">${pin}${titleEl}</div>
    <div class="meta-row"><span class="chapter">${esc(chTxt)}</span>${stBadge}${seBadge}</div>
    <div class="sub-row"><span class="time">${esc(relTime(row.last_read))}</span><span class="links">${links}</span></div>
  </div>
  <button class="card-edit" data-key="${esc(row.key)}" title="편집">⋯</button>
</div>`;
}

// ── 필터 + 정렬 적용 ───────────────────────────────────────────────────
function applyView() {
  const listEl  = document.getElementById('list');
  const statEl  = document.getElementById('stat');
  const q       = document.getElementById('search').value.trim().toLowerCase();

  let rows = allRows;
  if (activeStatus !== 'all')  rows = rows.filter(r => r.status === activeStatus);
  if (onlyComplete)            rows = rows.filter(r => isCompletedRow(r));
  if (activeSite)              rows = rows.filter(r => r.sites?.[activeSite]);
  if (q)                       rows = rows.filter(r => r.title.toLowerCase().includes(q));

  if (activeSort === 'title')   rows = [...rows].sort((a,b) => a.title.localeCompare(b.title,'ko'));
  if (activeSort === 'chapter') rows = [...rows].sort((a,b) => b.chapter - a.chapter);

  const at = localStorage.getItem(STORE_CACHE_AT);
  statEl.textContent = `전체 ${allRows.length}편 · 표시 ${rows.length}편`
    + (at ? ` · 갱신 ${relTime(at)}` : '');
  listEl.innerHTML = rows.length
    ? rows.map(renderCard).join('')
    : `<div class="empty">${q ? '검색 결과가 없습니다.' : '작품이 없습니다.'}</div>`;
}

// ── Supabase fetch ─────────────────────────────────────────────────────
async function fetchLibrary() {
  const url = localStorage.getItem(STORE_URL);
  const key = localStorage.getItem(STORE_KEY);
  const res = await fetch(
    `${url.replace(/\/+$/,'')}/rest/v1/manga_reading?select=*&order=pinned.desc,last_read.desc`,
    { headers: { apikey: key, Authorization: `Bearer ${key}` } }
  );
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadLibrary(fromCache = false) {
  const listEl = document.getElementById('list');

  // 캐시 우선 즉시 표시
  if (fromCache) {
    const cached = localStorage.getItem(STORE_CACHE);
    if (cached) {
      allRows = JSON.parse(cached);
      renderSiteFilter();
      applyView();
    } else {
      listEl.innerHTML = '<div class="loading">불러오는 중...</div>';
    }
  } else {
    listEl.innerHTML = '<div class="loading">불러오는 중...</div>';
  }

  try {
    const rows = await fetchLibrary();
    allRows = rows;
    localStorage.setItem(STORE_CACHE, JSON.stringify(rows));
    try { localStorage.setItem(STORE_CACHE_AT, new Date().toISOString()); } catch {}
    showStale(null);
    renderSiteFilter();
    applyView();
  } catch (e) {
    if (!allRows.length) {
      listEl.innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}</div>`;
      showStale(null);
    } else {
      // 캐시가 있으면 화면은 그대로 두되, 옛 데이터임을 반드시 알린다.
      // (이걸 숨기면 죽은 도메인 URL을 최신으로 오인하게 된다)
      showStale(e.message);
    }
  }
}

// 갱신 실패 배너. msg=null이면 감춘다.
function showStale(msg) {
  const el = document.getElementById('stale');
  if (!el) return;
  if (!msg) { el.classList.remove('show'); return; }
  const at  = localStorage.getItem(STORE_CACHE_AT);
  const age = at ? relTime(at) : '시점 불명';
  el.querySelector('.msg').textContent = `⚠ 갱신 실패 (${msg}) — ${age} 캐시를 표시 중입니다. 링크가 옛 주소일 수 있습니다.`;
  el.classList.add('show');
}

// ── 토스트 ──────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, actionLabel, onAction) {
  const el = document.getElementById('toast');
  el.textContent = '';
  el.appendChild(Object.assign(document.createElement('span'), { textContent: msg }));
  if (actionLabel && onAction) {
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', () => { hideToast(); onAction(); });
    el.appendChild(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 9000 : 3000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

// 쓰기 동작 공통 래퍼 — 실패를 조용히 삼키지 않는다.
async function guard(fn) {
  try { await fn(); } catch (e) { toast(`❌ ${e.message}`); }
}

// ── Supabase 쓰기 ───────────────────────────────────────────────────────
function supaBase() { return (localStorage.getItem(STORE_URL) || '').replace(/\/+$/,''); }

async function supaSend(method, pathQuery, body, prefer) {
  const key = localStorage.getItem(STORE_KEY);
  const headers = { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' };
  if (method !== 'GET') {
    headers.Prefer = prefer || (method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal');
  }
  const res = await fetch(`${supaBase()}/rest/v1/${pathQuery}`, {
    method, headers, body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0,120)}`);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

// 유저스크립트의 normalizeSyncMeta + touchSync 와 동일한 규약으로 sites.__mss_sync 를 갱신한다.
function touchRowSync(row, fields, at) {
  const sites = (row.sites && typeof row.sites === 'object') ? row.sites : {};
  const cur   = (sites[SYNC_KEY] && typeof sites[SYNC_KEY] === 'object') ? sites[SYNC_KEY] : {};
  const s = { dataVersion: DATA_VERSION };
  for (const k of Object.values(SYNC_FIELDS)) s[k] = cur[k] || row.last_read || at;
  s.entryUpdatedAt = at;
  for (const f of fields) { const k = SYNC_FIELDS[f]; if (k) s[k] = at; }
  sites[SYNC_KEY] = s;
  row.sites = sites;
  return row;
}

// 유저스크립트 _pushOne 과 같은 열 구성으로 upsert 한다.
function rowPayload(row) {
  return {
    key: row.key, title: row.title, chapter: row.chapter, last_read: row.last_read,
    sites: row.sites, pinned: !!row.pinned, status: row.status || 'reading', series: row.series || null,
  };
}

// 썸네일 data URI가 실려 큰 편이라 나눠 보낸다.
async function saveRows(rows) {
  for (let i = 0; i < rows.length; i += 15) {
    await supaSend('POST', 'manga_reading', rows.slice(i, i + 15).map(rowPayload));
  }
}

function persistCache() {
  try { localStorage.setItem(STORE_CACHE, JSON.stringify(allRows)); } catch {}
}

async function updateWork(row, patch, fields) {
  Object.assign(row, patch);
  touchRowSync(row, fields, new Date().toISOString());
  await saveRows([row]);
  persistCache();
  applyView();
}

// ── 삭제 (tombstone) ────────────────────────────────────────────────────
async function fetchSettingValue(key) {
  const r = await supaSend('GET', `manga_settings?key=eq.${encodeURIComponent(key)}&select=value`);
  const v = Array.isArray(r) ? r[0]?.value : null;
  return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
}

// 유저스크립트의 삭제 이력(복원 가능)과 같은 형태로 되돌린다.
function rowToEntry(row) {
  const sites = {};
  for (const [k, v] of Object.entries(row.sites || {})) if (!k.startsWith('__')) sites[k] = v;
  const e = {
    title: row.title, chapter: row.chapter, lastRead: row.last_read, sites,
    pinned: !!row.pinned, status: row.status || 'reading', series: row.series || null,
  };
  const sync = row.sites?.[SYNC_KEY];
  if (sync && typeof sync === 'object') e.sync = clone(sync);
  const meta = extractMeta(row.sites);
  if (meta) e.meta = clone(meta);
  return e;
}

// tombstone을 먼저 쓰고 행을 지운다. 순서를 뒤집으면 다른 기기의 pushAll이 작품을 되살린다.
// tombstone만 남고 행이 남아도 유저스크립트 pullAll이 스스로 정리하므로 이 순서가 안전하다.
async function deleteWork(row) {
  const now = new Date().toISOString();
  const tombs = await fetchSettingValue('deletedManga');
  tombs[row.key] = { title: row.title || row.key, deletedAt: now, entry: rowToEntry(row) };
  await supaSend('POST', 'manga_settings', [{ key: 'deletedManga', value: tombs, updated_at: now }]);
  await supaSend('DELETE', `manga_reading?key=eq.${encodeURIComponent(row.key)}`);
  allRows = allRows.filter(r => r.key !== row.key);
  persistCache();
  renderSiteFilter();
  applyView();
}

// ── 사이트 필터 ─────────────────────────────────────────────────────────
function renderSiteFilter() {
  const sel = document.getElementById('site-filter');
  const set = new Set();
  allRows.forEach(r => visibleSites(r.sites).forEach(([s]) => set.add(s)));
  const list = [...set].sort();
  sel.innerHTML = ['<option value="">모든 사이트</option>',
    ...list.map(s => `<option value="${esc(s)}">${esc(s)}</option>`)].join('');
  if (!list.includes(activeSite)) activeSite = '';
  sel.value = activeSite;
}

// ── 도메인 점검 / 변경 ──────────────────────────────────────────────────
function collectDomains(rows) {
  const bySite = new Map();
  for (const r of rows) {
    for (const [site, info] of visibleSites(r.sites)) {
      if (!info?.domain) continue;
      if (!bySite.has(site)) bySite.set(site, new Map());
      const m = bySite.get(site);
      m.set(info.domain, (m.get(info.domain) || 0) + 1);
    }
  }
  return bySite;
}

function renderDomains() {
  const el = document.getElementById('dom-list');
  const bySite = collectDomains(allRows);
  if (!bySite.size) { el.innerHTML = '<div class="empty" style="padding:24px 0">저장된 주소가 없습니다.</div>'; return; }
  el.innerHTML = [...bySite.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([site, counts]) => {
    const multi = counts.size > 1;
    const rows = [...counts.entries()].sort((a,b) => b[1]-a[1]).map(([d,c]) => `
      <div class="dom-row">
        <div class="dom-name">${esc(d)}</div><div class="dom-cnt">${c}개</div>
        <button class="dom-btn" data-site="${esc(site)}" data-domain="${esc(d)}">변경</button>
      </div>`).join('');
    return `<div class="dom-group">
      <div class="dom-head">
        <span class="dom-site">${esc(site)}</span>
        ${multi ? `<span class="dom-warn">주소 ${counts.size}종</span>` : ''}
        ${multi ? `<button class="dom-btn dom-all" data-site="${esc(site)}" data-all="1">모두 변경</button>` : ''}
      </div>${rows}</div>`;
  }).join('');
}

// hostname만 정확히 교체한다. 문자열 치환은 경로/쿼리를 깨뜨린다.
function replaceHost(url, newHost) {
  try { const u = new URL(url); u.hostname = newHost; return u.toString(); } catch { return url; }
}

// 유저스크립트 applyPlanItems + retargetMetaListUrl 과 같은 처리.
// meta.listUrl 을 빼먹으면 sites 는 최신인데 작품정보만 죽은 호스트를 두드린다.
function retargetRow(row, site, newDomain) {
  const info = row.sites?.[site];
  if (!info?.domain || info.domain === newDomain) return null;
  const at = new Date().toISOString();
  info.url = replaceHost(info.url, newDomain);
  info.domain = newDomain;
  info.updatedAt = at;
  const fields = ['sites'];
  const meta = row.sites?.[META_KEY];
  if (meta && typeof meta === 'object' && meta.site === site && meta.listUrl) {
    const nu = replaceHost(meta.listUrl, newDomain);
    if (nu !== meta.listUrl) { meta.listUrl = nu; fields.push('meta'); }
  }
  touchRowSync(row, fields, at);
  return row;
}

async function applyDomainChange(site, onlyDomain) {
  const newDomain = document.getElementById('dom-new').value.trim().toLowerCase();
  if (!newDomain)             { toast('❌ 새 도메인을 입력하세요'); return; }
  if (!HOST_PAT.test(newDomain)) { toast('❌ 도메인 형식이 올바르지 않습니다 (호스트명만)'); return; }
  if (onlyDomain === newDomain)  { toast('❌ 옛 주소와 새 주소가 같습니다'); return; }

  const targets = allRows.filter(r => {
    const d = r.sites?.[site]?.domain;
    return d && d !== newDomain && (!onlyDomain || d === onlyDomain);
  });
  if (!targets.length) { toast(`✅ ${site}는 이미 모두 ${newDomain} 입니다`); return; }

  const label = onlyDomain ? `${onlyDomain} → ${newDomain}` : `${site} 옛 주소 전체 → ${newDomain}`;
  if (!confirm(`${label}\n대상: ${targets.length}개\n\n적용할까요?`)) return;

  // 뷰어에는 유저스크립트 같은 자동 백업이 없다. 변경 전 원본을 남겨 되돌릴 수 있게 한다.
  // rowPayload는 row.sites를 그대로 참조하므로 반드시 깊은 복사로 떠 둔다.
  try {
    localStorage.setItem(STORE_UNDO, JSON.stringify({
      at: new Date().toISOString(), label, rows: targets.map(r => clone(rowPayload(r))),
    }));
  } catch {}

  const changed = targets.map(r => retargetRow(r, site, newDomain)).filter(Boolean);
  await saveRows(changed);
  persistCache();
  applyView();
  renderDomains();
  toast(`✅ ${changed.length}개 변경`, '되돌리기', () => guard(undoDomainChange));
}

async function undoDomainChange() {
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(STORE_UNDO) || 'null'); } catch {}
  if (!snap?.rows?.length) { toast('되돌릴 내역이 없습니다'); return; }
  if (!confirm(`되돌리기: ${snap.label}\n${snap.rows.length}개를 이전 상태로 복원합니다.`)) return;
  // 되돌리기도 "가장 최근 쓰기"여야 유저스크립트가 다시 덮어쓰지 않는다.
  const at = new Date().toISOString();
  snap.rows.forEach(r => touchRowSync(r, ['sites','meta'], at));
  await saveRows(snap.rows);
  localStorage.removeItem(STORE_UNDO);
  await loadLibrary();
  toast('↩ 되돌렸습니다');
}

// ── 작품 편집 시트 ──────────────────────────────────────────────────────
let workKey = null;
function currentWork() { return allRows.find(r => r.key === workKey) || null; }

function syncWorkSheet() {
  const row = currentWork();
  if (!row) return;
  document.getElementById('work-title').textContent = row.title || row.key;
  const sites = visibleSites(row.sites).map(([s]) => s).join(', ');
  document.getElementById('work-sub').textContent = `${row.chapter}화 · ${sites || '사이트 없음'}`;
  document.querySelectorAll('#work-status button')
    .forEach(b => b.classList.toggle('on', (row.status || 'reading') === b.dataset.v));
  document.querySelectorAll('#work-pin button')
    .forEach(b => b.classList.toggle('on', String(row.pinned ? 1 : 0) === b.dataset.v));
  document.getElementById('work-ch').value = row.chapter ?? 0;
}

function openWork(key) {
  workKey = key;
  if (!currentWork()) return;
  syncWorkSheet();
  document.getElementById('work-modal').classList.add('open');
}
function closeWork() {
  document.getElementById('work-modal').classList.remove('open');
  workKey = null;
}

// ── 통계 ────────────────────────────────────────────────────────────────
function showStats() {
  const rows  = allRows;
  const total = rows.length;
  if (!total) return;
  const reading   = rows.filter(r => r.status === 'reading').length;
  const paused    = rows.filter(r => r.status === 'paused').length;
  const done      = rows.filter(r => r.status === 'done').length;
  const completed = rows.filter(r => isCompletedRow(r)).length;
  const pinned    = rows.filter(r => r.pinned).length;
  const totalCh   = rows.reduce((s,r) => s + (r.chapter||0), 0);

  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">전체</div></div>
    <div class="stat-card"><div class="num" style="color:var(--st-reading)">${reading}</div><div class="lbl">읽는 중</div></div>
    <div class="stat-card"><div class="num" style="color:var(--st-paused)">${paused}</div><div class="lbl">중단</div></div>
    <div class="stat-card"><div class="num" style="color:var(--st-done)">${done}</div><div class="lbl">완료</div></div>
    <div class="stat-card"><div class="num" style="color:var(--b-completed)">${completed}</div><div class="lbl">완결</div></div>
    <div class="stat-card"><div class="num">${pinned}</div><div class="lbl">📌 고정</div></div>
    <div class="stat-card full"><div class="num">${totalCh.toLocaleString()}</div><div class="lbl">총 읽은 화수</div></div>`;
  document.getElementById('stats-modal').classList.add('open');
}

// ── Pull-to-refresh ────────────────────────────────────────────────────
(function() {
  const ptr = document.getElementById('ptr');
  let startY = 0, pulling = false, triggered = false;
  document.addEventListener('touchstart', e => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; triggered = false; }
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 10) { ptr.classList.add('active'); }
    if (dy > 80 && !triggered) { triggered = true; ptr.textContent = '↑ 새로고침'; }
  }, {passive:true});
  document.addEventListener('touchend', () => {
    if (!pulling) return;
    if (triggered) loadLibrary();
    ptr.classList.remove('active');
    ptr.textContent = '↓';
    pulling = false;
  });
})();

// ── UI 이벤트 ─────────────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeStatus = tab.dataset.status;
  applyView();
});

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSort = btn.dataset.sort;
    applyView();
  });
});

document.getElementById('chip-completed').addEventListener('click', function() {
  onlyComplete = !onlyComplete;
  this.classList.toggle('active', onlyComplete);
  applyView();
});

document.getElementById('site-filter').addEventListener('change', function() {
  activeSite = this.value;
  applyView();
});

document.getElementById('search').addEventListener('input', applyView);
document.getElementById('btn-refresh').addEventListener('click', () => loadLibrary());

// 탭에 돌아왔을 때 1분 넘게 묵은 데이터면 조용히 다시 받는다 (캐시를 먼저 그려 깜빡임 없음).
// 폰 브라우저는 탭을 suspend하므로 로드 시점에만 fetch하면 며칠 지난 화면을 그대로 보게 된다.
// 이때 fetch는 실패한 게 아니라 아예 실행되지 않아 갱신 실패 배너도 뜨지 않는다.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!localStorage.getItem(STORE_URL) || !localStorage.getItem(STORE_KEY)) return;
  if (document.getElementById('main').style.display === 'none') return;
  const at = Date.parse(localStorage.getItem(STORE_CACHE_AT) || '');
  if (!at || Date.now() - at > 60_000) loadLibrary(true);
});

// ── 작품 편집 ────────────────────────────────────────────────────────
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('.card-edit');
  if (btn) openWork(btn.dataset.key);
});

document.getElementById('work-status').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const row = currentWork(); if (!row || (row.status || 'reading') === b.dataset.v) return;
  guard(async () => {
    await updateWork(row, { status: b.dataset.v }, ['status']);
    syncWorkSheet();
    toast('✅ 상태를 바꿨습니다');
  });
});

document.getElementById('work-pin').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const row = currentWork(); if (!row) return;
  const next = b.dataset.v === '1';
  if (!!row.pinned === next) return;
  guard(async () => {
    await updateWork(row, { pinned: next }, ['pinned']);
    syncWorkSheet();
    toast(next ? '📌 고정했습니다' : '고정을 해제했습니다');
  });
});

document.getElementById('work-ch-save').addEventListener('click', () => {
  const row = currentWork(); if (!row) return;
  const v = parseInt(document.getElementById('work-ch').value, 10);
  if (!Number.isFinite(v) || v < 0) { toast('❌ 화수는 0 이상의 숫자여야 합니다'); return; }
  if (v === row.chapter) { toast('변경 없음'); return; }
  guard(async () => {
    await updateWork(row, { chapter: v }, ['chapter']);
    syncWorkSheet();
    toast(`✅ ${v}화로 수정했습니다`);
  });
});

document.getElementById('work-del').addEventListener('click', () => {
  const row = currentWork(); if (!row) return;
  if (!confirm(`"${row.title || row.key}"을(를) 라이브러리에서 삭제합니다.\n\n유저스크립트의 설정 → 🧰 → 🗑 삭제 이력에서 복원할 수 있습니다.`)) return;
  guard(async () => {
    await deleteWork(row);
    closeWork();
    toast('🗑 삭제했습니다 (삭제 이력에서 복원 가능)');
  });
});

document.getElementById('work-close').addEventListener('click', closeWork);
document.getElementById('work-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeWork();
});

// ── 도메인 점검 ──────────────────────────────────────────────────────
document.getElementById('btn-domain').addEventListener('click', () => {
  renderDomains();
  document.getElementById('domain-modal').classList.add('open');
});
document.getElementById('dom-list').addEventListener('click', e => {
  const b = e.target.closest('.dom-btn'); if (!b) return;
  guard(() => applyDomainChange(b.dataset.site, b.dataset.all ? null : b.dataset.domain));
});
document.getElementById('dom-undo').addEventListener('click', () => guard(undoDomainChange));
document.getElementById('dom-close').addEventListener('click', () => {
  document.getElementById('domain-modal').classList.remove('open');
});
document.getElementById('domain-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
document.getElementById('stale-retry').addEventListener('click', () => loadLibrary());
document.getElementById('btn-stats').addEventListener('click', showStats);
document.getElementById('stats-close').addEventListener('click', () => {
  document.getElementById('stats-modal').classList.remove('open');
});
document.getElementById('stats-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

// ── 설정 ─────────────────────────────────────────────────────────────
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('inp-url').value = localStorage.getItem(STORE_URL) || '';
  document.getElementById('inp-key').value = localStorage.getItem(STORE_KEY) || '';
  document.getElementById('main').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
});

document.getElementById('setup-save').addEventListener('click', async () => {
  const url    = document.getElementById('inp-url').value.trim();
  const key    = document.getElementById('inp-key').value.trim();
  const errEl  = document.getElementById('setup-err');
  if (!url || !key)               { errEl.textContent = 'URL과 Key를 모두 입력하세요.'; return; }
  if (!url.startsWith('https://')) { errEl.textContent = 'URL은 https://로 시작해야 합니다.'; return; }
  errEl.textContent = '연결 확인 중...';
  try {
    const res = await fetch(`${url.replace(/\/+$/,'')}/rest/v1/manga_reading?select=key&limit=1`,
      { headers: { apikey: key, Authorization: `Bearer ${key}` } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch(e) { errEl.textContent = `연결 실패: ${e.message}`; return; }
  localStorage.setItem(STORE_URL, url);
  localStorage.setItem(STORE_KEY, key);
  errEl.textContent = '';
  showMain();
});

function showMain() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  loadLibrary(true);
}

// ── 엔트리포인트 ─────────────────────────────────────────────────────
if (localStorage.getItem(STORE_URL) && localStorage.getItem(STORE_KEY)) {
  showMain();
} else {
  document.getElementById('setup').style.display = 'flex';
}
</script>
</body>
</html>
